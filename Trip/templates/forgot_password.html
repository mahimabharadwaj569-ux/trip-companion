<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password</title>


    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">


    <style>
        body {

            margin: 0;

            padding: 0;

            min-height: 100vh;


            background:

                linear-gradient(rgba(0, 0, 0, 0.45),

                    rgba(0, 0, 0, 0.45)),

                url("https://images.unsplash.com/photo-1500534623283-312aade485b7");


            background-size: cover;

            background-position: center;

            background-repeat: no-repeat;


            font-family: Arial, sans-serif;


            display: flex;

            justify-content: center;

            align-items: center;

        }


        .auth-card {

            width: 400px;

            padding: 30px;


            background: rgba(255, 255, 255, 0.95);


            border-radius: 15px;


            box-shadow:

                0 10px 30px rgba(0, 0, 0, 0.3);

        }


        .auth-icon {

            text-align: center;

            font-size: 40px;

        }


        h1 {

            text-align: center;

        }


        .auth-card p {

            text-align: center;

        }


        label {

            display: block;

            margin-top: 15px;

            margin-bottom: 5px;

            font-weight: bold;

        }


        input {

            width: 100%;

            padding: 12px;


            box-sizing: border-box;


            border: 1px solid #ccc;

            border-radius: 8px;

        }


        input:focus {

            outline: none;

            border-color: #dc3545;

        }


        .btn {

            width: 100%;

            padding: 12px;


            margin-top: 20px;


            border: none;

            border-radius: 8px;


            font-size: 16px;

            cursor: pointer;

        }


        .red-btn {

            background-color: #dc3545;

            color: white;

        }


        .red-btn:hover {

            background-color: #c82333;

        }


        .bottom-text {

            margin-top: 20px;

        }


        .bottom-text a {

            color: #007bff;

            text-decoration: none;

            font-weight: bold;

        }


        .bottom-text a:hover {

            text-decoration: underline;

        }


        .back-link {

            display: block;

            text-align: center;

            margin-top: 15px;


            color: #333;

            text-decoration: none;

        }


        .back-link:hover {

            text-decoration: underline;

        }


        .message {

            padding: 10px;

            margin: 10px 0;

            border-radius: 6px;

            text-align: center;

        }
    </style>

</head>


<body class="auth-page">


    <div class="auth-card forgot-card">


        <div class="auth-icon">

            🔴

        </div>


        <h1>

            Forgot Password?

        </h1>


        <p>

            Enter your registered email address.

        </p>


        <!-- FLASH MESSAGE -->


        {% with messages = get_flashed_messages(with_categories=true) %}


        {% for category, message in messages %}


        <div class="message {{ category }}">

            {{ message }}

        </div>


        {% endfor %}


        {% endwith %}


        <!-- FORGOT PASSWORD FORM -->


        <form method="POST" action="{{ url_for('forgot_password') }}">


            <label>

                📧 Registered Email

            </label>


            <input type="email" name="email" placeholder="Enter your registered email" required>


            <button type="submit" class="btn red-btn">

                🔑 Continue

            </button>


        </form>


        <p class="bottom-text">


            Remember your password?


            <a href="{{ url_for('login') }}">

                Login

            </a>


        </p>


        <a href="{{ url_for('home') }}" class="back-link">

            ← Back to Home

        </a>


    </div>


</body>

</html>
